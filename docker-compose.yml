services:
  api:
    build: ./backend
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped

  proxy:
    image: caddy:2.8
    restart: unless-stopped
    # Only HTTP by default. With a bare IP there is no certificate, and an open 443 that fails TLS
    # makes Chrome's automatic HTTPS upgrade show an error page instead of falling back to HTTP.
    # With a domain in SITE_ADDRESS: docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
    ports:
      - "80:80"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend

volumes:
  caddy_data:
  caddy_config:
